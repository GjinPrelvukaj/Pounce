<style>
:root{
  /* cool neutral stack — Linear/Apple lineage, no warmth */
  --bg:#08090A;
  --surface:#0D0E10;
  --raised:#131417;
  --raised-2:#191B1F;
  --border:#1E2024;
  --border-2:#292C32;

  --text:#F7F8F8;
  --text-2:#9CA3AE;   /* 7.8:1 */
  --text-3:#767C87;   /* 4.8:1 */

  --accent:#5E6AD2;
  --accent-text:#828CF2;   /* 6.7:1 — accent as text/active */
  --accent-dim:rgba(94,106,210,.14);
  --accent-line:rgba(94,106,210,.42);
  --on-accent:#FFFFFF;

  --crit:#F2777A;
  --warn:#E5B84B;
  --note:#56C7E0;
  --pass:#4BC98A;
  --crit-dim:rgba(242,119,122,.13);
  --warn-dim:rgba(229,184,75,.13);
  --note-dim:rgba(86,199,224,.13);
  --pass-dim:rgba(75,201,138,.13);

  --t-xs:.6875rem;
  --t-sm:.75rem;
  --t-md:.8125rem;
  --t-lg:.875rem;

  --r-sm:5px;
  --r-md:7px;
  --row-h:32px;
  --ease:cubic-bezier(.22,.75,.25,1);
  --shadow:0 1px 2px rgba(0,0,0,.28),0 6px 20px -8px rgba(0,0,0,.5);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:var(--t-md);line-height:1.45;letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}

::selection{background:var(--accent-line);color:var(--text);}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2E3138;border:3px solid var(--bg);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:#3C4048;}
*{scrollbar-color:#2E3138 transparent;scrollbar-width:thin;}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:1px;border-radius:var(--r-sm);}
input{caret-color:var(--accent-text);}

.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:0;}

.app{display:grid;grid-template-rows:auto auto auto 1fr auto;height:100vh;position:relative;}

/* hairline crawl progress, browser-loader style */
.topline{position:absolute;top:0;left:0;right:0;height:2px;background:var(--border);z-index:10;}
.topline i{
  display:block;height:100%;width:100%;background:var(--accent);
  transform-origin:left center;transform:scaleX(.82);
  transition:transform .5s var(--ease);
}

/* ---- header ---- */
.header{
  display:flex;align-items:center;gap:16px;
  height:48px;padding:2px 14px 0;
  background:var(--surface);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:8px;}
.brand-name{font-weight:600;font-size:var(--t-lg);letter-spacing:-.02em;}

.target{display:flex;align-items:center;gap:8px;min-width:0;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--pass);flex:none;}
@media (prefers-reduced-motion:no-preference){
  .dot{animation:pulse 2s var(--ease) infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
}
.target-url{
  font-family:"JetBrains Mono",monospace;font-size:var(--t-md);color:var(--text-2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:0;
}

.telemetry{display:flex;align-items:center;gap:18px;margin-left:auto;}
.tm{display:flex;align-items:baseline;gap:5px;}
.tm-v{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:var(--t-md);color:var(--text);letter-spacing:0;}
.tm-v.hot{color:var(--accent-text);}
.tm-l{font-size:var(--t-xs);color:var(--text-3);}

.actions{display:flex;align-items:center;gap:6px;padding-left:16px;margin-left:2px;border-left:1px solid var(--border);}

.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:28px;padding:0 10px;
  background:var(--raised);color:var(--text-2);
  border:1px solid var(--border-2);border-radius:var(--r-sm);
  font-family:inherit;font-size:var(--t-sm);font-weight:500;letter-spacing:-.008em;
  cursor:pointer;
  transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease);
}
.btn:hover{background:var(--raised-2);color:var(--text);border-color:#33373E;}
.btn:active{background:#0F1113;}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.btn:disabled:hover{background:var(--raised);color:var(--text-2);border-color:var(--border-2);}
.btn-primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:600;}
.btn-primary:hover{background:#6D78DD;border-color:#6D78DD;color:var(--on-accent);}

/* ---- tabs on top ---- */
.tabs{
  display:flex;align-items:center;gap:2px;
  height:40px;padding:0 10px;
  background:var(--surface);border-bottom:1px solid var(--border);
  overflow-x:auto;scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none;}
.tab{
  display:inline-flex;align-items:center;gap:7px;
  height:28px;padding:0 11px;flex:none;
  background:none;border:none;border-radius:var(--r-sm);
  color:var(--text-3);font-family:inherit;font-size:var(--t-md);font-weight:500;letter-spacing:-.008em;
  cursor:pointer;
  transition:background .14s var(--ease),color .14s var(--ease);
}
.tab:hover{background:var(--raised);color:var(--text-2);}
.tab[aria-selected="true"]{background:var(--raised-2);color:var(--text);}
.tab .cnt{
  font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;
  font-size:var(--t-xs);color:var(--text-3);letter-spacing:0;
}
.tab[aria-selected="true"] .cnt{color:var(--text-2);}
.tab svg{flex:none;}
.tab-div{width:1px;height:16px;background:var(--border);margin:0 6px;flex:none;}

/* ---- toolbar ---- */
.toolbar{
  display:flex;align-items:center;gap:8px;
  height:42px;padding:0 14px;
  background:var(--bg);border-bottom:1px solid var(--border);
}
.search{
  display:flex;align-items:center;gap:7px;
  height:28px;padding:0 9px;flex:1;max-width:320px;
  background:var(--raised);border:1px solid var(--border-2);border-radius:var(--r-sm);
  transition:border-color .15s var(--ease),background .15s var(--ease);
}
.search:focus-within{border-color:var(--accent);background:var(--raised-2);}
.search input{
  flex:1;background:none;border:none;outline:none;color:var(--text);
  font-family:inherit;font-size:var(--t-md);letter-spacing:-.008em;
}
.search input::placeholder{color:var(--text-3);}
.spacer{flex:1;}
.rowcount{font-family:"JetBrains Mono",monospace;font-size:var(--t-sm);color:var(--text-3);font-variant-numeric:tabular-nums;letter-spacing:0;}

/* ---- body ---- */
.body{display:grid;grid-template-columns:1fr 348px;min-height:0;}
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg);}
.tscroll{flex:1;overflow:auto;min-height:0;}

table{border-collapse:separate;border-spacing:0;width:100%;font-size:var(--t-md);}
thead th{
  position:sticky;top:0;z-index:2;background:var(--bg);
  font-size:var(--t-xs);font-weight:500;color:var(--text-3);
  text-align:left;white-space:nowrap;letter-spacing:.02em;
  padding:0 12px;height:30px;
  border-bottom:1px solid var(--border);
  cursor:pointer;user-select:none;
  transition:color .14s var(--ease);
}
thead th:hover{color:var(--text-2);}
thead th.sorted{color:var(--text);}
thead th .sort{color:var(--accent-text);margin-left:4px;}

tbody td{
  padding:0 12px;height:var(--row-h);
  border-bottom:1px solid rgba(30,32,36,.6);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--text-2);
}
tbody tr{cursor:pointer;transition:background .12s var(--ease);}
tbody tr:hover td{background:var(--surface);}
tbody tr[aria-selected="true"] td{background:var(--accent-dim);color:var(--text);}
tbody tr[aria-selected="true"] .url{color:var(--accent-text);}

.url{font-family:"JetBrains Mono",monospace;font-size:var(--t-md);color:var(--text);max-width:0;letter-spacing:0;}
.num{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;letter-spacing:0;}
.dim{color:var(--text-3);}

.code{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-weight:500;letter-spacing:0;}
.code.ok{color:var(--pass);}
.code.redir{color:var(--note);}
.code.cli{color:var(--warn);}
.code.srv{color:var(--crit);}

.sev{display:inline-flex;align-items:center;gap:5px;}
.sev svg{flex:none;}
.sev-crit{color:var(--crit);}
.sev-warn{color:var(--warn);}
.sev-note{color:var(--note);}
.sev-pass{color:var(--pass);}
.sev .n{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums;font-size:var(--t-xs);letter-spacing:0;}

.tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:var(--t-xs);font-weight:500;letter-spacing:-.005em;}
.tag-idx{background:var(--pass-dim);color:var(--pass);}
.tag-non{background:var(--crit-dim);color:var(--crit);}
.tag-can{background:var(--note-dim);color:var(--note);}

.len-over{color:var(--warn);}
.len-miss{color:var(--crit);}

/* ---- detail ---- */
.detail{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;}
.dtabs{display:flex;gap:2px;padding:7px 8px;border-bottom:1px solid var(--border);flex:none;}
.dtab{
  padding:0 10px;height:26px;
  background:none;border:none;border-radius:var(--r-sm);
  color:var(--text-3);font-family:inherit;font-size:var(--t-sm);font-weight:500;letter-spacing:-.008em;
  cursor:pointer;transition:background .14s var(--ease),color .14s var(--ease);
}
.dtab:hover{background:var(--raised);color:var(--text-2);}
.dtab[aria-selected="true"]{background:var(--raised-2);color:var(--text);}

.dbody{flex:1;overflow-y:auto;padding:16px;min-height:0;}
.durl{
  font-family:"JetBrains Mono",monospace;font-size:var(--t-md);color:var(--text);
  word-break:break-all;line-height:1.5;margin-bottom:18px;letter-spacing:0;
}
.dsec{margin-bottom:20px;}
.dsec-t{font-size:var(--t-xs);color:var(--text-3);font-weight:600;letter-spacing:.03em;margin-bottom:8px;}
.dfield{display:flex;gap:12px;padding:4px 0;font-size:var(--t-md);align-items:baseline;}
.dfield dt{color:var(--text-3);width:92px;flex:none;font-size:var(--t-sm);}
.dfield dd{margin:0;color:var(--text);flex:1;min-width:0;word-break:break-word;}
dl{margin:0;}

.dissue{
  display:flex;gap:9px;padding:10px;margin-bottom:6px;
  background:var(--raised);border-radius:var(--r-md);
  font-size:var(--t-md);align-items:flex-start;
}
.dissue svg{flex:none;margin-top:1px;}
.dissue-t{color:var(--text);font-weight:500;display:block;}
.dissue-d{color:var(--text-3);font-size:var(--t-sm);display:block;margin-top:2px;line-height:1.45;}

/* ---- status bar ---- */
.statusbar{
  display:flex;align-items:center;gap:0;height:26px;padding:0 14px;
  background:var(--surface);border-top:1px solid var(--border);
  font-size:var(--t-xs);color:var(--text-3);
}
.sb{padding:0 12px;border-right:1px solid var(--border);display:flex;align-items:center;gap:6px;height:13px;}
.sb:first-child{padding-left:0;}
.sb:last-child{border-right:none;margin-left:auto;padding-right:0;}
.sb .mono{font-size:var(--t-xs);color:var(--text-2);}
</style>

const codeClass = c => c<300?'ok':c<400?'redir':c<500?'cli':'srv';
const ixTag = ix => ix==='Indexable'?'<span class="tag tag-idx">Indexable</span>'
  : ix==='Canonicalised'?'<span class="tag tag-can">Canonical</span>'
  : '<span class="tag tag-non">Non-Index</span>';
const lenCell = (n,max) => n===0 ? '<span class="len-miss">—</span>'
  : `<span class="${n>max?'len-over':''}">${n}</span>`;

const rowsEl = document.getElementById('rows');
rowsEl.innerHTML = DATA.map((r,i)=>`
  <tr data-i="${i}" aria-selected="${i===3}" tabindex="0">
    <td><span class="sev sev-${r.sev}">${ICON[r.sev]}${r.issues.length?`<span class="n">${r.issues.length}</span>`:''}</span></td>
    <td class="url" title="${r.u}">${r.u}</td>
    <td><span class="code ${codeClass(r.c)}">${r.c}</span></td>
    <td>${ixTag(r.ix)}</td>
    <td title="${r.t||''}">${r.t||'<span class="dim">—</span>'}</td>
    <td class="num">${lenCell(r.tl,60)}</td>
    <td title="${r.d||''}">${r.d||'<span class="dim">—</span>'}</td>
    <td class="num">${lenCell(r.dl,155)}</td>
    <td class="num">${r.w||'<span class="dim">—</span>'}</td>
    <td class="num">${r.il.toLocaleString()}</td>
    <td class="num">${r.r>1000?`<span style="color:var(--crit)">${(r.r/1000).toFixed(1)}s</span>`:r.r+'ms'}</td>
    <td class="num dim">${r.sz}</td>
    <td class="num dim">${r.dp}</td>
  </tr>`).join('');

const detailEl = document.getElementById('detail');
function renderDetail(i){
  const r = DATA[i];
  detailEl.innerHTML = `
    <div class="durl">${r.u}</div>
    <div class="dsec">
      <div class="dsec-t">Response</div>
      <dl>
        <div class="dfield"><dt>Status</dt><dd><span class="code ${codeClass(r.c)}">${r.c}</span></dd></div>
        <div class="dfield"><dt>Indexability</dt><dd>${ixTag(r.ix)}</dd></div>
        <div class="dfield"><dt>Response</dt><dd class="mono">${r.r>1000?(r.r/1000).toFixed(1)+' s':r.r+' ms'}</dd></div>
        <div class="dfield"><dt>Size</dt><dd class="mono">${r.sz}</dd></div>
        <div class="dfield"><dt>Depth</dt><dd class="mono">${r.dp}</dd></div>
        <div class="dfield"><dt>Inlinks</dt><dd class="mono">${r.il.toLocaleString()}</dd></div>
      </dl>
    </div>
    <div class="dsec">
      <div class="dsec-t">Metadata</div>
      <dl>
        <div class="dfield"><dt>Title</dt><dd>${r.t||'<span class="len-miss">Missing</span>'}${r.tl?` <span class="mono dim">(${r.tl})</span>`:''}</dd></div>
        <div class="dfield"><dt>Description</dt><dd>${r.d||'<span class="len-miss">Missing</span>'}${r.dl?` <span class="mono dim">(${r.dl})</span>`:''}</dd></div>
        <div class="dfield"><dt>Words</dt><dd class="mono">${r.w?r.w.toLocaleString():'—'}</dd></div>
      </dl>
    </div>
    <div class="dsec">
      <div class="dsec-t">Issues ${r.issues.length?`(${r.issues.length})`:''}</div>
      ${r.issues.length ? r.issues.map(([s,t,d])=>`
        <div class="dissue sev-${s}">${ICON[s]}
          <span><span class="dissue-t">${t}</span><span class="dissue-d">${d}</span></span>
        </div>`).join('')
      : `<div class="dissue sev-pass">${ICON.pass}<span><span class="dissue-t">No issues found</span><span class="dissue-d">This URL passed all 30 checks in this crawl.</span></span></div>`}
    </div>`;
}
renderDetail(3);

rowsEl.addEventListener('click', e => {
  const tr = e.target.closest('tr'); if(!tr) return;
  rowsEl.querySelectorAll('tr[aria-selected="true"]').forEach(x=>x.setAttribute('aria-selected','false'));
  tr.setAttribute('aria-selected','true');
  renderDetail(+tr.dataset.i);
});
rowsEl.addEventListener('keydown', e => {
  if(e.key!=='Enter' && e.key!==' ') return;
  e.preventDefault(); e.target.closest('tr')?.click();
});
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-selected','false'));
  t.setAttribute('aria-selected','true');
});
document.querySelector('.dtabs').addEventListener('click', e => {
  const t = e.target.closest('.dtab'); if(!t) return;
  document.querySelectorAll('.dtab').forEach(x=>x.setAttribute('aria-selected','false'));
  t.setAttribute('aria-selected','true');
});

let crawled = 284113, pct = 82.0, secs = 221;
setInterval(()=>{
  const rate = 1180 + Math.floor(Math.random()*260);
  crawled += Math.round(rate/2);
  pct = Math.min(99.4, pct + 0.09);
  secs += 0.5;
  document.getElementById('s-crawled').textContent = crawled.toLocaleString();
  document.getElementById('s-rate').textContent = rate.toLocaleString();
  document.getElementById('s-bar').style.transform = 'scaleX('+(pct/100)+')';
  document.getElementById('s-elapsed').textContent =
    String(Math.floor(secs/60)).padStart(2,'0')+':'+String(Math.floor(secs%60)).padStart(2,'0');
  document.getElementById('rc').textContent = crawled.toLocaleString();
}, 500);
</script>
