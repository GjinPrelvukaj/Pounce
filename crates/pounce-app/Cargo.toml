[package]
name = "pounce-app"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "Tauri shell: commands and events over the engine"

# Not on by default: devtools ship a whole inspector in the binary, and M5's
# release must not carry one. `--features devtools` is for diagnosing a
# release-only failure, which is the only kind this project has hit so far.
[features]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
pounce-audit = { path = "../pounce-audit" }
pounce-core = { path = "../pounce-core" }
pounce-parse = { path = "../pounce-parse" }
pounce-run = { path = "../pounce-run" }
pounce-store = { path = "../pounce-store" }
serde.workspace = true
serde_json.workspace = true
tauri = { workspace = true }
