[package]
name = "pounce-bench"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "Deterministic fixture site and benchmark runner for Pounce"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tokio.workspace = true

[dev-dependencies]
criterion.workspace = true
lol_html.workspace = true
reqwest.workspace = true
tower.workspace = true

# Targets are declared as their files land, so the workspace always builds.
# See docs/plans/2026-08-19-phase-0-benchmark-harness.md

[[bin]]
name = "fixture-site"
path = "src/bin/fixture_site.rs"

[[bin]]
name = "bench-runner"
path = "src/bin/bench_runner.rs"
