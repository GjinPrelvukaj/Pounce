[package]
name = "pounce-seo"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish = false
description = "Headless CLI for Pounce crawls"

[[bin]]
name = "pounce"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
pounce-core = { path = "../pounce-core" }
