name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri links against the system WebView. macOS and Windows ship theirs;
      # Linux needs webkit2gtk and friends, and without them `pounce-app`
      # fails to build with a pkg-config error that looks nothing like the
      # cause.
      - name: Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux WebView dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev build-essential file
      # Single-threaded: the metrics tests spawn child processes and sample
      # their memory, and parallel test threads make those timings flaky.
      # --lib --bins --tests rather than --all-targets: criterion benches are
      # not libtest harnesses and reject --test-threads. The bench-smoke job
      # covers them.
      - run: cargo test --workspace --lib --bins --tests -- --test-threads=1

  bench-smoke:
    name: benchmarks compile and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Proves the benches still compile and execute without spending CI
      # minutes on statistically meaningful sample counts. Real throughput
      # numbers are measured locally on consistent hardware — shared CI
      # runners are too noisy for a regression threshold to mean anything.
      - run: cargo bench -p pounce-bench -- --test

  ui:
    name: frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      # `npm run build` is `tsc -b && vite build`, so this is the typecheck as
      # well as the bundle. No WebView packages needed: nothing here touches
      # Tauri's Rust side.
      - run: npm run build
        working-directory: ui
