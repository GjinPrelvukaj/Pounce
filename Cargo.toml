[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false          # proprietary — nothing goes to crates.io
repository = "https://github.com/GjinPrelvukaj/Pounce"
rust-version = "1.97"

[workspace.dependencies]
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8"
lol_html = "3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.39"
robotxt = { version = "0.6", default-features = false, features = ["parser"] }
thiserror = "2.0"
url = "2.5"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower = "0.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "gzip"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
debug = true
